<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadMirror</title>
  <style>
    :root{--bg:#fff;--text:#111;--muted:#6b6b6b;--line:#eaeaea;--accent:#1a8917}
    *{box-sizing:border-box}
    body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{width:300px;padding:12px}
    .title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
    .hint{color:var(--muted);margin:6px 0 10px}
    .btn{display:flex;align-items:center;justify-content:center;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#111;cursor:pointer}
    .btn:hover{box-shadow:inset 0 0 0 1px #eaeaea}
    .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .toggle{appearance:none;width:44px;height:26px;border-radius:999px;background:#e9e9ea;position:relative;border:1px solid #dadada}
    .toggle:checked{background:#cfead2;border-color:#b7e0bb}
    .toggle::after{content:"";position:absolute;top:50%;left:2px;width:20px;height:20px;border-radius:50%;transform:translate(0,-50%);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .14s cubic-bezier(.2,.9,.2,1)}
    .toggle:checked::after{transform:translate(18px,-50%)}
    .foot{margin-top:10px;color:var(--muted);font-size:12px}
  </style>
  <script defer src="popup.js"></script>
  </head>
<body>
  <div class="wrap">
    <div class="title"><span class="dot"></span><strong>ReadMirror</strong></div>
    <button id="openBtn" class="btn">Open this page in ReadMirror</button>
    <div class="row">
      <span>Auto‑redirect Medium articles</span>
      <input id="autoToggle" type="checkbox" class="toggle">
    </div>
    <div class="foot">Right-click on the extension icon for more options</div>
  </div>
</body>
</html>
